          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  visitorId:
                    type: integer
                    format: uint64
                  startedAt:
                    $ref: '#/components/schemas/Date'
                  endedAt:
                    $ref: '#/components/schemas/Date'
                  originalOrdersAmountGoaled:
                    type: integer
                    format: int64
                    description: Sum of order original net totals (VAT-excluded) for orders placed while the customer had an active goal.
                  originalOrdersAmountUngoaled:
                    type: integer
                    format: int64
                    description: Sum of order original net totals (VAT-excluded) for orders placed while the customer had no active goal.
                  ordersCountGoaled:
                    type: integer
                    format: int64
                  ordersCountUngoaled:
                    type: integer
                    format: int64
                  deliveredOrdersAmountGoaled:
                    type: integer
                    format: int64
                    description: Sum of delivered order net totals (VAT-excluded) for goaled customers.
                  deliveredOrdersAmountUngoaled:
                    type: integer
                    format: int64
                    description: Sum of delivered order net totals (VAT-excluded) for ungoaled customers.
                  deliveredOrdersCountGoaled:
                    type: integer
                    format: int64
                  deliveredOrdersCountUngoaled:
                    type: integer
                    format: int64
                  canceledOrdersOriginalAmountGoaled:
                    type: integer
                    format: int64
                    description: Sum of canceled order original net totals (VAT-excluded) for goaled customers.
                  canceledOrdersOriginalAmountUngoaled:
                    type: integer
                    format: int64
                    description: Sum of canceled order original net totals (VAT-excluded) for ungoaled customers.
                  canceledOrdersCountGoaled:
                    type: integer
                    format: int64
                  canceledOrdersCountUngoaled:
                    type: integer
                    format: int64
                  assignedCustomersCount:
                    type: integer
                    format: int64
                  assignedCustomersCountGoaled:
                    type: integer
                    format: int64
                    description: Number of assigned customers whose assignment and customer goal overlap the requested period while their visitor is in the requested subtree.
                  currentAllocatedCustomersCountGoaled:
                    type: integer
                    format: int64
                    description: Number of customers currently allocated to the requested subtree who currently have an active goal, regardless of the requested period.
                  currentAllocatedCustomersCountUngoaled:
                    type: integer
                    format: int64
                    description: Number of customers currently allocated to the requested subtree who do not currently have an active goal, regardless of the requested period.
                  currentAllocatedCustomersCountTotal:
                    type: integer
                    format: int64
                    description: Total number of customers currently allocated to the requested subtree, regardless of the requested period.
                  activeCustomersCountGoaled:
                    type: integer
                    format: int64
                    description: Number of goaled customers with at least one delivered order in the requested period.
                  activeCustomersCountUngoaled:
                    type: integer
                    format: int64
                    description: Number of ungoaled customers with at least one delivered order in the requested period.
                  submittedCustomersCountGoaled:
                    type: integer
                    format: int64
                    description: Number of goaled customers who submitted at least one order in the requested period, including orders later delivered or canceled.
                  submittedCustomersCountUngoaled:
                    type: integer
                    format: int64
                    description: Number of ungoaled customers who submitted at least one order in the requested period, including orders later delivered or canceled.
                  goaledCoverage:
                    type: number
                    format: double
                    description: Assignment-period-weighted percentage of goaled customers who submitted an order in the requested period across the requested visitor subtree.
                  ungoaledCoverage:
                    type: number
                    format: double
                    description: Assignment-period-weighted percentage of ungoaled customers who submitted an order in the requested period across the requested visitor subtree.
                  totalCoverage:
                    type: number
                    format: double
                    description: Assignment-period-weighted percentage of all assigned customers who submitted an order in the requested period across the requested visitor subtree.
                  amountGoal:
                    type: integer
                    format: int64
                    description: Combined customer and visitor revenue goal quota attributed to the requested subtree and period.
                  countGoal:
                    type: integer
                    format: int64
                    description: Combined customer and visitor order-count goal quota attributed to the requested subtree and period.
                  customerAmountGoal:
                    type: integer
                    format: int64
                    description: Customer revenue goal quota attributed to the requested subtree and period.
                  customerCountGoal:
                    type: integer
                    format: int64
                    description: Customer order-count goal quota attributed to the requested subtree and period.
                  visitorAmountGoal:
                    type: integer
                    format: int64
                    description: Visitor revenue goal quota attributed to the requested subtree and period.
                  visitorCountGoal:
                    type: integer
                    format: int64
                    description: Visitor order-count goal quota attributed to the requested subtree and period.
                required:
                  - visitorId
                  - startedAt
                  - endedAt
                  - originalOrdersAmountGoaled
                  - originalOrdersAmountUngoaled
                  - ordersCountGoaled
                  - ordersCountUngoaled
                  - deliveredOrdersAmountGoaled
                  - deliveredOrdersAmountUngoaled
                  - deliveredOrdersCountGoaled
                  - deliveredOrdersCountUngoaled
                  - canceledOrdersOriginalAmountGoaled
                  - canceledOrdersOriginalAmountUngoaled
                  - canceledOrdersCountGoaled
                  - canceledOrdersCountUngoaled
                  - assignedCustomersCount
                  - assignedCustomersCountGoaled
                  - currentAllocatedCustomersCountGoaled
                  - currentAllocatedCustomersCountUngoaled
                  - currentAllocatedCustomersCountTotal
                  - activeCustomersCountGoaled
                  - activeCustomersCountUngoaled
                  - submittedCustomersCountGoaled
                  - submittedCustomersCountUngoaled
                  - goaledCoverage
                  - ungoaledCoverage
                  - totalCoverage
                  - amountGoal
                  - countGoal
                  - customerAmountGoal
                  - customerCountGoal
                  - visitorAmountGoal
                  - visitorCountGoal
      tags:
        - Visitor
