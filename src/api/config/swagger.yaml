          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: integer
                    format: uint64
                required:
                  - version
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                    enum:
                      - 2026
                  message:
                    type: string
                  metadata:
                    type: object
                    properties:
                      value:
                        type: string
                        nullable: true
                      version:
                        type: integer
                        format: uint64
                        nullable: true
                    required:
                      - value
                      - version
                required:
                  - code
                  - message
                  - metadata
      tags:
        - Client State
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User.ClientStateRequestBody'
