  /user/auth/impersonation:
    post:
      operationId: impersonate
      summary: Impersonate using Impersonation Token
      description: Consumes an impersonation token and opens a session as its target user. The token's scope and read-only setting govern the resulting session.
      parameters:
        - name: user-agent
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile:
                    $ref: '#/components/schemas/User.Profile'
                required:
                  - profile
      tags:
        - Impersonation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
              required:
                - token
  /user/auth/impersonation/token:
    post:
      operationId: generateImpersonationToken
      summary: Generate Impersonation Token
      description: Creates a short-lived token to open the target user's session in the selected application scope. Set `readonly` for a session that cannot make mutating requests.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  expiresIn:
                    type: integer
                    format: uint64
                    description: Expiration in seconds
                required:
                  - token
                  - expiresIn
      tags:
        - Impersonation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                targetUserId:
                  type: integer
                  format: uint64
                  description: ID of user to be impersonated
                targetAuthScope:
                  allOf:
                    - $ref: '#/components/schemas/AuthScope'
                  description: Application to impersonate user in
                readonly:
                  type: boolean
                  description: Impersonate in readonly mode (Safe Mode - Cannot make mutating requests)
              required:
                - targetUserId
                - targetAuthScope
                - readonly
  /user/auth/logout:
