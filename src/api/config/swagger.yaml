      type: object
      required:
        - value
      properties:
        value:
          type: string
          description: Opaque client-owned state value. Stored size must not exceed the configured client-state entry limit.
        ttl:
          type: integer
          format: uint64
          nullable: true
          minimum: 1
          description: Entry lifetime in seconds. Omit or send null for no expiration.
          default: null
        shareWithImpersonators:
          type: boolean
          description: Whether impersonated sessions may read, overwrite, or delete this entry.
          default: true
        expectedVersion:
          type: integer
          format: uint64
          nullable: true
          description: Expected version number to ensure atomic updates. Omit or send null for no version. If a newer version exists the put API will throw a 409
          default: null
