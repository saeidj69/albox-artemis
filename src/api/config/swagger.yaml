        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: Updated group name (1-255 characters)
              required:
                - name
    delete:
      operationId: deleteGroup
      summary: Delete Group
      description: Delete a user group. The group must not have any users assigned to it.
      parameters:
        - name: groupId
          in: path
          required: true
          description: Group ID
          schema:
            type: integer
            format: uint64
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
      tags:
        - Group Management
  /user/permission-sets:
    get:
      operationId: listPermissionSets
      summary: List Permission Sets
      description: |-
        Return all permission sets along with the permissions they bundle.
        Requires 'ViewAllPermissionSets' permission.

        May throw:
        - ForbiddenException if user doesn't have permission
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  permissionSets:
                    type: array
                    items:
                      $ref: '#/components/schemas/User.PermissionSet'
                required:
                  - permissionSets
      tags:
        - Permission Set Management
    post:
      operationId: createPermissionSet
      summary: Create a Permission Set
      description: |-
        Create a new permission set bundling the listed permissions.

        Requires 'CreatePermissionSets' permission AND the caller must already hold
        every permission they are putting into the set (escalation guard).

        May throw:
        - ForbiddenException if the caller lacks 'CreatePermissionSets'
        - PermissionEscalationException if the caller lacks any of the listed permissions themselves
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  permissionSet:
                    $ref: '#/components/schemas/User.PermissionSet'
                required:
                  - permissionSet
      tags:
        - Permission Set Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: Display name for the set (must be unique).
                  example: Order Manager
                permissions:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  description: Permissions to bundle in this set.
                  example:
                    - view_any_order
                    - edit_order
                    - cancel_order
              required:
                - name
                - permissions
  /user/permission-sets/{permissionSetId}:
    put:
      operationId: updatePermissionSet
      summary: Update a Permission Set
      description: |-
        Replace the name and permission membership of an existing set. The `permissions`
        array is interpreted declaratively — any permission not in the new list is treated
        as removed; any permission newly present is treated as added.

        Requires 'UpdatePermissionSets' permission AND the caller must already hold every
        permission being **added** to the set. The caller does NOT need to hold permissions
        being removed.

        Propagation:
        - When `propagate` is `false` (default), only the canonical set is mutated. Users
          who hold this set retain whatever permission rows they had previously, even if
          those rows now differ from the set's membership.
        - When `propagate` is `true`, the change is applied to every user holding this set
          via a queued job. Before the job is dispatched, the API performs a pre-flight
          conflict check: if propagating an added permission would collide with a permission
          the user already holds (directly or via another set), the request is rejected
          with `permission_already_held` and the canonical set is NOT modified.

        May throw:
        - ForbiddenException if the caller lacks 'UpdatePermissionSets'
        - PermissionSetNotFoundException if the set does not exist
        - PermissionEscalationException if the caller lacks any newly-added permission
        - PermissionAlreadyHeldException if `propagate=true` and at least one user would conflict
      parameters:
        - name: permissionSetId
          in: path
          required: true
          description: Permission set ID
          schema:
            type: integer
            format: uint64
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  permissionSet:
                    $ref: '#/components/schemas/User.PermissionSet'
                required:
                  - permissionSet
      tags:
        - Permission Set Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: New display name (must be unique).
                  example: Order Editor
                permissions:
                  type: array
                  items:
                    type: string
                  description: Full, declarative list of permissions the set should contain after the update.
                  example:
                    - view_any_order
                    - edit_order
                propagate:
                  type: boolean
                  description: If true, the change is propagated to user_permissions rows of every user holding this set (via a queued job).
                  default: false
              required:
                - name
                - permissions
    delete:
      operationId: deletePermissionSet
      summary: Delete a Permission Set
      description: |-
        Delete a permission set. The set must not be assigned to any user — revoke all
        assignments first.

        Requires 'DeletePermissionSets' permission.

        May throw:
        - ForbiddenException if user doesn't have permission
        - PermissionSetNotFoundException if the set does not exist
        - PermissionSetInUseException if the set is currently assigned to at least one user
      parameters:
        - name: permissionSetId
          in: path
          required: true
          description: Permission set ID
          schema:
            type: integer
            format: uint64
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
      tags:
        - Permission Set Management
