  /visitor/visitors/{visitorId}/customers:
    get:
      operationId: listVisitorCustomers
      summary: List Visitor Customers
      description: Lists customers assigned directly to a visitor or anywhere in their subtree. Use `me` for the current visitor; optionally include order statistics for a bounded date range.
      parameters:
        - name: visitorId
          in: path
          required: true
          schema:
            anyOf:
              - type: integer
                format: uint64
              - type: string
                enum:
                  - me
        - name: scope
          in: query
          required: false
          description: 'Filter customers by assignment scope: `all` includes descendants; `direct` includes only direct assignments.'
          schema:
            type: string
            enum:
              - all
              - direct
          explode: false
        - name: query
          in: query
          required: false
          description: Full text search against customer name and mobile number
          schema:
            type: string
          explode: false
        - name: includeStatistics
          in: query
          required: false
          description: Set to `1` to include date-bounded order statistics for each returned customer. Omit or use `0` to keep the response identity-only.
          schema:
            type: string
            enum:
              - '0'
              - '1'
            default: '0'
          explode: false
        - name: start
          in: query
          required: false
          description: Required when includeStatistics is `1`.
          schema:
            $ref: '#/components/schemas/Date'
          explode: false
        - name: end
          in: query
          required: false
          description: Required when includeStatistics is `1`; maximum range is 370 days.
          schema:
            $ref: '#/components/schemas/Date'
          explode: false
        - name: cursor
          in: query
          required: false
          description: Cursor for pagination. Use the `nextCursor` value from the previous response to fetch the next page of results.
          schema:
            type: string
            nullable: true
          explode: false
        - name: limit
          in: query
          required: false
          description: Number of customers to return per page
          schema:
            type: integer
            format: uint8
            minimum: 1
            maximum: 100
            default: 20
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  customers:
                    type: array
                    items:
                      type: object
                      properties:
