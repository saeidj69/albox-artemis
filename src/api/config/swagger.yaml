                          type: integer
                          format: uint64
                        mobileNumber:
                          $ref: '#/components/schemas/PhoneNumber'
                        firstName:
                          type: string
                        lastName:
                          type: string
                        statistics:
                          type: object
                          allOf:
                            - $ref: '#/components/schemas/Visitor.CustomerOrderStatistics'
                          nullable: true
                      required:
                        - id
                        - mobileNumber
                        - firstName
                        - lastName
                        - statistics
                  metadata:
                    type: object
                    properties:
                      nextCursor:
                        type: string
                        nullable: true
                        description: Cursor for the next page of results. Null if no more results.
                    required:
                      - nextCursor
                required:
                  - customers
                  - metadata
      tags:
        - Visitor
