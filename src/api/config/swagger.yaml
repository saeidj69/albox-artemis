        notifications:
          type: array
          items:
            $ref: '#/components/schemas/Incentives.NotificationInput'
          maxItems: 20
          description: Replaces the whole notification set.
      description: |-
        Partial campaign definition; only supplied fields are changed. Draft campaigns only.

        Date rules differ from creation because a draft may already have started: `endAt` may never be
        set to, or left at, a past instant, and `startAt` may not be moved further back than its current
        value once that value is already in the past.
    Incentives.CustomerCampaign:
      type: object
      required:
        - id
        - displayName
        - description
        - startAt
        - endAt
        - progression
        - rewardResolution
        - rewardTiming
        - state
        - confirmedAt
        - settlementStartedAt
        - completedAt
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: uint64
        displayName:
          type: string
        description:
          type: string
          nullable: true
        startAt:
          $ref: '#/components/schemas/DateTimeAtom'
        endAt:
          $ref: '#/components/schemas/DateTimeAtom'
        progression:
          $ref: '#/components/schemas/Incentives.CampaignProgression'
        rewardResolution:
          $ref: '#/components/schemas/Incentives.RewardResolution'
        rewardTiming:
          $ref: '#/components/schemas/Incentives.RewardTiming'
        state:
          $ref: '#/components/schemas/Incentives.CampaignState'
        confirmedAt:
          type: string
          allOf:
            - $ref: '#/components/schemas/DateTimeAtom'
          nullable: true
        settlementStartedAt:
          type: string
          allOf:
            - $ref: '#/components/schemas/DateTimeAtom'
          nullable: true
        completedAt:
          type: string
          allOf:
            - $ref: '#/components/schemas/DateTimeAtom'
          nullable: true
        createdAt:
