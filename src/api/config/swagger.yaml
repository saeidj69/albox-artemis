      tags:
        - User Auth Scope Access
    put:
      operationId: replaceUserAuthScopeAccesses
      summary: Replace a User's Auth Scope Access
      description: |-
        Atomically replaces the user's direct-login and unrestricted impersonation matrix.
        The request must contain every auth scope exactly once. A globally allowed login scope
        must remain enabled. Requires `manage_user_auth_scope_accesses`; holders may grant
        access they do not personally hold. Impersonated sessions are rejected.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: uint64
      responses:
        '200':
          description: The request has succeeded.
