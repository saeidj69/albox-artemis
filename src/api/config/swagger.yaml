                  type: integer
                  format: uint32
                  minimum: 0
                  description: Number of hours before delivery start after which new bookings are closed.
                bookingHorizonHours:
                  type: integer
                  format: uint32
                  minimum: 0
                  description: Number of hours before delivery start from which the schedule becomes bookable. Must be >= bookingCutoffHours.
                dispatchLeadTimeHours:
                  type: integer
                  format: uint32
