        steps:
          type: array
          items:
            $ref: '#/components/schemas/Incentives.ParticipantStep'
        settlement:
          type: object
          allOf:
            - $ref: '#/components/schemas/Incentives.ParticipantSettlement'
          nullable: true
        rewards:
          type: array
          items:
            $ref: '#/components/schemas/Incentives.CustomerReward'
      description: A participation as shown to the customer who owns it; carries customer-safe rewards.
    Incentives.CustomerReward:
      type: object
      required:
        - id
        - participantStepId
        - type
        - payload
        - state
        - externalReference
        - resolvedAt
        - grantedAt
      properties:
        id:
          type: integer
          format: uint64
        participantStepId:
