        updatedAt:
          $ref: '#/components/schemas/DateTimeAtom'
      description: |-
        A campaign as shown to a customer taking part in it.

        `internalName`, `confirmedBy`, and `settlementStartedBy` are deliberately absent: the internal
        name is the staff-facing key and the other two are internal user IDs. `steps` and `notifications`
        are never returned here either; a customer reads their own targets and percentages from
        `participant.steps[].campaignStep` and `participant.steps[].ruleParams`/`rewardParams`, which are
        frozen per customer and may differ from the campaign-level definition.
    Incentives.CustomerParticipant:
      type: object
      required:
        - id
        - campaignId
        - customerId
        - customer
        - createdAt
        - updatedAt
      properties:
        id:
