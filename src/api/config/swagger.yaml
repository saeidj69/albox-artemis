  /user/users:
    get:
      operationId: listUsers
      summary: List Users
      description: |-
        List users with optional filters. The `permissions` filter narrows the result to
        users holding **every** listed permission (AND semantics, regardless of whether
        each permission was granted directly or via a permission set).

        Requires 'ViewAllUsers' permission. When the `permissions` filter is provided
        (and non-empty), 'FilterUsersByPermission' is additionally required.
      parameters:
        - name: query
          in: query
          required: false
          description: fuzzy full text search against query
          schema:
            type: string
            minLength: 2
          explode: false
        - name: mobileNumber
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PhoneNumber'
          explode: false
        - name: nationalCode
          in: query
          required: false
          schema:
            type: string
          explode: false
        - name: isActive
          in: query
          required: false
          schema:
            type: boolean
          explode: false
        - name: groupIds
          in: query
          required: false
          schema:
            type: array
            items:
              type: integer
              format: uint64
          explode: false
        - name: permissions
          in: query
          required: false
          description: Filter users by held permission values (snake_case). Returns users who hold every listed permission. Requires 'FilterUsersByPermission' when used.
          schema:
            type: array
            items:
              type: string
          explode: false
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            nullable: true
            default: null
          explode: false
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: uint8
