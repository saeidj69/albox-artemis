      required:
        - customerId
        - steps
      properties:
        customerId:
          type: integer
          format: uint64
        steps:
          type: array
          items:
            $ref: '#/components/schemas/Incentives.ParticipantStepInput'
          description: Must contain exactly one item for every campaign step; it freezes this customer's target and reward percentage.
    Incentives.ParticipantSettlement:
      type: object
      required:
        - id
        - result
        - settledAt
      properties:
        id:
          type: integer
          format: uint64
        result:
          type: object
          additionalProperties: {}
          description: Frozen final rule evaluation, not a live recalculation.
        settledAt:
          $ref: '#/components/schemas/DateTimeAtom'
    Incentives.ParticipantStep:
      type: object
      required:
        - id
        - campaignStepId
        - ruleParams
        - rewardParams
        - campaignStep
      properties:
        id:
          type: integer
          format: uint64
        campaignStepId:
          type: integer
          format: uint64
        ruleParams:
          type: object
          additionalProperties: {}
        rewardParams:
          type: object
          additionalProperties: {}
          nullable: true
        campaignStep:
          type: object
          allOf:
            - $ref: '#/components/schemas/Incentives.CampaignStep'
          nullable: true
    Incentives.ParticipantStepInput:
      type: object
      required:
        - campaignStepId
        - ruleParams
      properties:
        campaignStepId:
          type: integer
          format: uint64
        ruleParams:
          type: object
          additionalProperties: {}
          description: 'Current eligible-purchase rule: `{ target_amount: positive integer }`, represented in the smallest money unit used by Orders.'
        rewardParams:
          type: object
          additionalProperties: {}
          nullable: true
          description: 'Current percentage gift reward: `{ percentage: numeric 0 < value <= 1 }`; use `0.01`, `0.015`, `0.02` for 1%, 1.5%, 2%. Null only when the campaign step has no reward.'
    Incentives.Reward:
      type: object
      required:
        - id
        - participantStepId
        - type
        - payload
        - state
        - externalReference
        - lastError
        - resolvedAt
        - grantedAt
      properties:
        id:
          type: integer
          format: uint64
        participantStepId:
          type: integer
          format: uint64
        type:
          $ref: '#/components/schemas/Incentives.RewardType'
        payload:
          type: object
          additionalProperties: {}
          description: Snapshot at settlement. Percentage gift rewards contain `percentage`, `finalized_orders_net_total`, and final `amount`.
        state:
          $ref: '#/components/schemas/Incentives.RewardState'
        externalReference:
          type: string
          nullable: true
        lastError:
          type: string
          nullable: true
          description: Operational error kept after a failed wallet credit.
        resolvedAt:
          type: string
          allOf:
            - $ref: '#/components/schemas/DateTimeAtom'
          nullable: true
        grantedAt:
          type: string
          allOf:
            - $ref: '#/components/schemas/DateTimeAtom'
          nullable: true
    Incentives.RewardResolution:
      type: string
      enum:
        - cumulative
        - highest_wins
      description: '`highest_wins` grants only the highest achieved reward-bearing step; `cumulative` grants every achieved reward-bearing step.'
    Incentives.RewardState:
      type: string
      enum:
        - pending
        - failed
        - granted
    Incentives.RewardTiming:
      type: string
      enum:
        - campaign_end
      description: The current server accepts only `campaign_end`; rewards are calculated during settlement after the window ends.
    Incentives.RewardType:
      type: string
      enum:
        - gift_percentage_over_finalized_orders_net_total
    Incentives.RuleType:
      type: string
      enum:
        - eligible_purchase_amount
    Incentives.SettlementSummary:
      type: object
      required:
        - startedAt
        - startedBy
        - completedAt
        - participantsCount
        - settledParticipantsCount
        - pendingParticipantsCount
        - failedRewardsCount
        - pendingRewardsCount
        - unresolvedRewardsCount
        - failedRewardsSample
      properties:
        startedAt:
          type: string
          allOf:
            - $ref: '#/components/schemas/DateTimeAtom'
          nullable: true
        startedBy:
          type: integer
          format: uint64
          nullable: true
        completedAt:
          type: string
          allOf:
            - $ref: '#/components/schemas/DateTimeAtom'
          nullable: true
          description: |-
            Set by a scheduled finalizer rather than by the last reward grant, so it can lag the final
            successful grant by several minutes. `unresolvedRewardsCount` of 0 together with a null
            `completedAt` means "finalizing", not "stuck".
        participantsCount:
          type: integer
          format: int32
        settledParticipantsCount:
          type: integer
          format: int32
        pendingParticipantsCount:
          type: integer
          format: int32
        failedRewardsCount:
          type: integer
          format: int32
          description: Rewards whose wallet credit failed. These are retried automatically; there is no manual retry endpoint.
        pendingRewardsCount:
          type: integer
          format: int32
          description: Rewards created but not yet granted. Also retried automatically if they stall.
        unresolvedRewardsCount:
          type: integer
          format: int32
          description: '`failedRewardsCount + pendingRewardsCount`. The campaign cannot complete while this is non-zero.'
        failedRewardsSample:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                format: uint64
              participantId:
                type: integer
                format: uint64
              participantStepId:
                type: integer
                format: uint64
              lastError:
                type: string
                nullable: true
            required:
              - id
              - participantId
              - participantStepId
              - lastError
          maxItems: 20
          description: |-
            A bounded diagnostic sample: at most the 10 oldest and 10 newest failed rewards. The complete
            set is deliberately never returned, because a payment outage on a large campaign can produce
            far too many rows for one response. Use `failedRewardsCount` for the real total.
      description: |-
        Operational view of a campaign's settlement progress.

        Two independent things must finish before a campaign completes: every participant must be
        settled, and every reward must be granted. The reward counters exist because a campaign with all
        participants settled and zero *failed* rewards can still be blocked indefinitely by rewards that
        are merely *pending*.
    Latitude:
      type: number
      minimum: -90
      maximum: 90
      example: 35.7219
