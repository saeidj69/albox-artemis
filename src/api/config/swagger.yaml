        - title
        - ruleType
        - ruleConfig
      properties:
        id:
          type: integer
          format: uint64
        position:
          type: integer
          format: int32
          minimum: 1
        title:
          type: string
        description:
          type: string
          nullable: true
        ruleType:
          $ref: '#/components/schemas/Incentives.RuleType'
        ruleConfig:
          type: object
          additionalProperties: {}
          description: Must currently be `{}` for `eligible_purchase_amount`; customer-specific target belongs in ParticipantStepInput.ruleParams.
        rewardType:
          allOf:
            - $ref: '#/components/schemas/Incentives.RewardType'
          nullable: true
          description: Null creates a non-reward milestone.
        rewardConfig:
          type: object
          additionalProperties: {}
          nullable: true
          description: Must currently be `{}` for the percentage gift reward; customer-specific percentage belongs in ParticipantStepInput.rewardParams.
    Incentives.CampaignStepInput:
      type: object
      required:
        - position
        - title
        - ruleType
        - ruleConfig
      properties:
        position:
          type: integer
          format: int32
          minimum: 1
        title:
          type: string
        description:
          type: string
          nullable: true
        ruleType:
          $ref: '#/components/schemas/Incentives.RuleType'
        ruleConfig:
          type: object
          additionalProperties: {}
          description: Must currently be `{}` for `eligible_purchase_amount`; customer-specific target belongs in ParticipantStepInput.ruleParams.
        rewardType:
          allOf:
            - $ref: '#/components/schemas/Incentives.RewardType'
          nullable: true
          description: Null creates a non-reward milestone.
        rewardConfig:
          type: object
          additionalProperties: {}
          nullable: true
          description: Must currently be `{}` for the percentage gift reward; customer-specific percentage belongs in ParticipantStepInput.rewardParams.
      description: Shared step definition. Current rule and reward implementations require empty configuration objects.
    Incentives.CampaignUpdateInput:
      type: object
      properties:
        internalName:
          type: string
          description: Must not collide with another campaign's `internalName`.
        displayName:
          type: string
        description:
          type: string
          nullable: true
        startAt:
          $ref: '#/components/schemas/DateTimeAtom'
        endAt:
          $ref: '#/components/schemas/DateTimeAtom'
        progression:
          $ref: '#/components/schemas/Incentives.CampaignProgression'
        rewardResolution:
          $ref: '#/components/schemas/Incentives.RewardResolution'
        rewardTiming:
          $ref: '#/components/schemas/Incentives.RewardTiming'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/Incentives.CampaignStepInput'
