openapi: 3.0.0
info:
  title: Jupiter API
  description: |-
    Two authentication mechanisms are supported. Pick one in the **Authorize** dialog.

    **Bearer token (recommended for API clients).** Send `Authorization: Bearer <token>`.
    Tokens are database-backed API tokens: mint one with `php artisan user:create-api-token`
    and paste the raw value into the **Authorize** dialog. This is the only mechanism that
    works reliably from Swagger UI, Scalar, and other non-browser clients.

    **Session cookie (browser sessions).** The server reads `__Host-sessid-{scope}` where
    `{scope}` is one of `client`, `back_office`, `delivery_app`, `pos_user`, `visitor_app`.
    The scope is selected by the `X-Auth-Scope` request header and defaults to `client`
    (the cookie declared here is therefore `__Host-sessid-client`). Because the cookie is
    `HttpOnly` and uses the `__Host-` prefix, the browser must set it itself: it requires
    HTTPS (`Secure`), `Path=/`, no `Domain`, and it cannot be injected by JavaScript. In
    practice this means session cookies only work when the API and the docs UI are served
    from the same site over HTTPS; for cross-origin try-it-out you must configure an explicit
    `CORS_ALLOWED_ORIGINS` value (a wildcard `*` is rejected for credentialed requests) and
    send credentials.
  version: 0.0.0
