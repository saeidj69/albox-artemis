    Product.ProductPrice:
      type: object
      required:
        - id
        - productId
        - warehouseId
        - warehouseName
        - boxRetailPrice
        - boxPurchasePrice
        - retailPriceOverride
        - retailPriceOverriddenAt
        - isActive
        - deactivatedAt
        - createdAt
        - updatedAt
        - deletedAt
      properties:
        id:
          type: integer
          format: uint64
        productId:
          type: integer
          format: uint64
        warehouseId:
          type: integer
          format: uint64
          description: The warehouse this price applies to. A product can be priced differently per warehouse.
        warehouseName:
          type: string
          nullable: true
          description: Warehouse name, resolved for display. Null when the warehouse can no longer be resolved.
        boxRetailPrice:
          type: integer
          format: uint64
          minimum: 0
          description: The retail price reported by the source, in rials. This is stored evidence, not necessarily the price customers pay — see retailPriceOverride.
        boxPurchasePrice:
          type: integer
          format: uint64
          minimum: 0
          description: The purchase price reported by the source, in rials.
        retailPriceOverride:
          type: integer
          format: uint64
          nullable: true
          minimum: 0
          description: A manually set retail price override, in rials. While set, this is the price customers are charged instead of boxRetailPrice. It is released when synchronization reports a change to the reported retail price.
        retailPriceOverriddenAt:
          type: string
          allOf:
            - $ref: '#/components/schemas/DateTimeAtom'
          nullable: true
          description: When the current override was set. Null when no override is held.
        isActive:
          type: boolean
          description: Whether this price is approved for customers. A price can be current and still inactive.
        deactivatedAt:
          type: string
          allOf:
            - $ref: '#/components/schemas/DateTimeAtom'
          nullable: true
          description: When the price was deactivated. Null while active.
        createdAt:
          $ref: '#/components/schemas/DateTimeAtom'
        updatedAt:
          $ref: '#/components/schemas/DateTimeAtom'
        deletedAt:
          type: string
          allOf:
            - $ref: '#/components/schemas/DateTimeAtom'
          nullable: true
          description: Set when a price change replaced this row. Historical rows are kept, not overwritten.
      description: The current commercial price of one product at one warehouse.
