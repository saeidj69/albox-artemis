          $ref: '#/components/schemas/DateTimeAtom'
        updatedAt:
          $ref: '#/components/schemas/DateTimeAtom'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/Incentives.CampaignStep'
        notifications:
          type: array
          items:
            $ref: '#/components/schemas/Incentives.CampaignNotification'
    Incentives.CampaignInput:
      type: object
      required:
        - internalName
        - displayName
        - startAt
        - endAt
        - progression
        - rewardResolution
        - rewardTiming
        - steps
        - notifications
      properties:
        internalName:
          type: string
          description: |-
            Unique stable internal key; intended for administration/reporting rather than customer copy.
            Rejected when another campaign already uses the same value.
        displayName:
          type: string
          description: Customer-facing campaign name used in customer views and notification templates.
        description:
          type: string
          nullable: true
        startAt:
          allOf:
            - $ref: '#/components/schemas/DateTimeAtom'
          description: ISO-8601 atom timestamp; start is inclusive. Must not be in the past on creation.
        endAt:
          allOf:
            - $ref: '#/components/schemas/DateTimeAtom'
          description: ISO-8601 atom timestamp; end is exclusive. Must be after `startAt` and must not be in the past.
        progression:
          $ref: '#/components/schemas/Incentives.CampaignProgression'
        rewardResolution:
          $ref: '#/components/schemas/Incentives.RewardResolution'
        rewardTiming:
          $ref: '#/components/schemas/Incentives.RewardTiming'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/Incentives.CampaignStepInput'
          minItems: 1
          maxItems: 20
          description: '`position` must be unique across the campaign; duplicates are rejected on create, update, and confirm.'
        notifications:
          type: array
          items:
            $ref: '#/components/schemas/Incentives.NotificationInput'
          maxItems: 20
          description: Send `[]` explicitly when no notification is configured.
      description: |-
        Campaign creation/update payload.

        Example monthly highest-wins campaign: Mehr 1405 is sent as ISO/Atom dates, for example `startAt=2026-09-23T00:00:00+03:30` and
        `endAt=2026-10-23T00:00:00+03:30` for the half-open 1–30 Mehr window, with three `eligible_purchase_amount` steps with participant values 200,000,000→0.01, 400,000,000→0.015, and 800,000,000→0.02.
        The stored percentage is a fraction, so 1%, 1.5%, and 2% are `0.01`, `0.015`, and `0.02`.
    Incentives.CampaignNotification:
      type: object
      required:
        - id
        - interaction
        - config
        - template
      properties:
        id:
          type: integer
          format: uint64
        interaction:
          $ref: '#/components/schemas/Incentives.NotificationInteraction'
        config:
          type: object
          additionalProperties: {}
          description: |-
            Configuration by interaction:
            - campaign_started, step_achieved, reward_granted: `{}`
            - step_progress_percentage: `{ threshold: 1..100, basis: "certain" | "possible" }`
            - campaign_ending: `{ before_minutes: positive integer }`, which must be strictly shorter than
            the campaign's own duration, otherwise the notification would be eligible from the campaign's
            first moment.
        template:
          type: string
          description: |-
            Persian/UTF-8 SMS text. Placeholders are written as `{{name}}`, for example `{{customer_first_name}}`.
            May only contain placeholders supported by this `interaction`; see the placeholder table on this
            module's operations. Unsupported or misspelled placeholders are rejected when the campaign is
            confirmed, so they can never reach a customer.
    Incentives.CampaignProgression:
      type: string
      enum:
        - parallel
        - sequential
      description: Ordered campaign behavior. `sequential` locks each later step until all earlier steps are achieved.
    Incentives.CampaignState:
      type: string
      enum:
        - draft
        - upcoming
        - active
        - ended
        - settling
        - completed
    Incentives.CampaignStep:
