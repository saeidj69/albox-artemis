          type: string
    Incentives.EvaluatedStep:
      type: object
      required:
        - id
        - campaignStepId
        - position
        - title
        - certainProgress
        - possibleProgress
        - target
        - achieved
        - effectiveAchieved
        - progressionLocked
        - details
        - rewardResolved
        - estimatedReward
      properties:
        id:
          type: integer
          format: uint64
        campaignStepId:
          type: integer
          format: uint64
        position:
          type: integer
          format: int32
        title:
          type: string
        certainProgress:
          type: integer
          format: int64
          description: Delivered-and-paid order total in the campaign window. This alone can achieve a step.
        possibleProgress:
          type: integer
          format: int64
          description: Non-cancelled order total. Advisory only; can drive notifications but never reward eligibility.
        target:
          type: integer
          format: int64
        achieved:
          type: boolean
        effectiveAchieved:
          type: boolean
          description: False when an otherwise-achieved step is locked by sequential progression.
        progressionLocked:
          type: boolean
        details:
          type: object
          additionalProperties: {}
        rewardResolved:
          type: boolean
        estimatedReward:
          type: object
          properties:
            type:
              $ref: '#/components/schemas/Incentives.RewardType'
            payload:
              type: object
              additionalProperties: {}
          required:
            - type
            - payload
          nullable: true
    Incentives.Evaluation:
      type: object
      required:
        - isFinal
        - steps
        - resolvedStepIds
        - estimatedRewards
      properties:
        isFinal:
          type: boolean
          description: |-
            `false`: a live estimate recalculated on every request, which can still move as the customer's
            orders change.

            `true`: rebuilt from the frozen settlement snapshot taken when this participant was settled, so
            it matches the rewards that were actually granted. A settled participant is never re-evaluated,
            because a later order cancellation or refund would otherwise make this disagree with the amount
            already credited to the customer's wallet.
        steps:
          type: array
          items:
            $ref: '#/components/schemas/Incentives.EvaluatedStep'
        resolvedStepIds:
          type: array
          items:
            type: integer
            format: uint64
          description: Campaign-step IDs whose rewards are currently selected after progression and reward-resolution rules.
        estimatedRewards:
          type: array
          items:
            type: object
            properties:
              participantStepId:
                type: integer
                format: uint64
              type:
                $ref: '#/components/schemas/Incentives.RewardType'
              payload:
                type: object
                additionalProperties: {}
            required:
              - participantStepId
              - type
              - payload
          description: When `isFinal` is true these are the rewards that were actually created, not estimates.
      description: |-
        A participant's step-by-step standing.

        The shape is identical whether the participant is still being evaluated or has already been
        settled; `isFinal` distinguishes the two. Clients never need to read the raw
        `ParticipantSettlement.result` snapshot to render a settled participant.
    Incentives.NotificationInput:
      type: object
      required:
        - interaction
        - config
        - template
      properties:
        interaction:
          $ref: '#/components/schemas/Incentives.NotificationInteraction'
        config:
          type: object
          additionalProperties: {}
          description: |-
            Configuration by interaction:
            - campaign_started, step_achieved, reward_granted: `{}`
            - step_progress_percentage: `{ threshold: 1..100, basis: "certain" | "possible" }`
            - campaign_ending: `{ before_minutes: positive integer }`, which must be strictly shorter than
            the campaign's own duration, otherwise the notification would be eligible from the campaign's
            first moment.
        template:
          type: string
          description: |-
            Persian/UTF-8 SMS text. Placeholders are written as `{{name}}`, for example `{{customer_first_name}}`.
            May only contain placeholders supported by this `interaction`; see the placeholder table on this
            module's operations. Unsupported or misspelled placeholders are rejected when the campaign is
            confirmed, so they can never reach a customer.
    Incentives.NotificationInteraction:
      type: string
      enum:
        - campaign_started
        - step_achieved
        - step_progress_percentage
        - campaign_ending
        - reward_granted
    Incentives.Participant:
      type: object
      required:
        - id
        - campaignId
        - customerId
        - customer
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: uint64
        campaignId:
          type: integer
          format: uint64
        customerId:
          type: integer
          format: uint64
        customer:
          type: object
          allOf:
            - $ref: '#/components/schemas/Incentives.CustomerSummary'
          nullable: true
        createdAt:
          $ref: '#/components/schemas/DateTimeAtom'
        updatedAt:
          $ref: '#/components/schemas/DateTimeAtom'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/Incentives.ParticipantStep'
        settlement:
          type: object
          allOf:
            - $ref: '#/components/schemas/Incentives.ParticipantSettlement'
          nullable: true
        rewards:
          type: array
          items:
            $ref: '#/components/schemas/Incentives.Reward'
    Incentives.ParticipantInput:
