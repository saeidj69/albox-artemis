        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
      tags:
        - Auth
  /user/auth/otp:
    post:
      operationId: generateOtp
      summary: Generate OTP
      description: Sends a one-time code to the mobile number for the requested auth scope. The response gives code expiry, resend delay, and remaining-attempt limit.
      parameters:
        - name: user-agent
          in: header
          required: false
          schema:
            type: string
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ttl:
                    type: integer
                    format: uint16
                    description: How many seconds until this OTP is invalid
                  resendTtl:
                    type: integer
                    format: uint16
                    description: How many seconds until you can request a new OTP
                  maxTries:
                    type: integer
                    format: uint8
                    description: How many times can you enter the wrong OTP after which the OTP is invalid
                required:
                  - ttl
                  - resendTtl
                  - maxTries
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mobileNumber:
                  $ref: '#/components/schemas/PhoneNumber'
                scope:
                  $ref: '#/components/schemas/AuthScope'
              required:
                - mobileNumber
                - scope
      security:
        - {}
  /user/auth/otp/verify:
    post:
      operationId: verifyOtp
      summary: Verify OTP
      description: Verifies the one-time code and sets an authentication cookie. The returned state determines whether the session is ready, needs registration, or needs password verification.
      parameters:
        - name: user-agent
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Set-Cookie:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    properties:
                      state:
                        type: string
                        enum:
                          - valid
                      profile:
                        $ref: '#/components/schemas/User.Profile'
                      metadata:
                        type: object
                        additionalProperties: {}
                    required:
                      - state
                      - profile
                      - metadata
                  - type: object
                    properties:
                      state:
                        type: string
                        enum:
                          - pending_registration
                      profile:
                        nullable: true
                      metadata:
                        type: object
                        properties:
                          registrationTtl:
                            type: integer
                            format: uint16
                            description: Seconds remaining to complete registration before the session expires.
                        required:
                          - registrationTtl
                    required:
                      - state
                      - profile
                      - metadata
                  - type: object
                    properties:
                      state:
                        type: string
                        enum:
                          - pending_second_step
                      profile:
                        nullable: true
                      metadata:
                        type: object
                        properties:
                          secondStepTtl:
                            type: integer
                            format: uint16
                            description: Seconds remaining to verify the password before the session expires.
                        required:
                          - secondStepTtl
                    required:
                      - state
                      - profile
                      - metadata
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mobileNumber:
                  $ref: '#/components/schemas/PhoneNumber'
                otp:
                  type: string
                  example: '123456'
                fingerprint:
                  allOf:
                    - $ref: '#/components/schemas/User.DeviceFingerprint'
                  description: Optional device fingerprint for fraud detection signals.
              required:
                - mobileNumber
                - otp
      security:
        - {}
  /user/auth/password/verify:
    post:
      operationId: verifyPassword
      summary: Verify Password
      description: Completes the password step for a session awaiting second-factor verification and sets an authentication cookie.
      parameters:
        - name: user-agent
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Set-Cookie:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  state:
                    type: string
                    enum:
                      - valid
                  profile:
                    $ref: '#/components/schemas/User.Profile'
                  metadata:
                    nullable: true
                required:
                  - state
                  - profile
                  - metadata
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                fingerprint:
                  allOf:
                    - $ref: '#/components/schemas/User.DeviceFingerprint'
                  description: Optional device fingerprint for fraud detection signals.
              required:
                - password
      security:
        - {}
  /user/auth/register:
    post:
      operationId: register
      summary: Register
      description: Completes registration for a session awaiting profile details and sets an authentication cookie.
      parameters:
        - name: user-agent
          in: header
          required: false
          schema:
            type: string
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          headers:
            Set-Cookie:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile:
                    $ref: '#/components/schemas/User.Profile'
                required:
                  - profile
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                  example: احمد
                lastName:
                  type: string
                  example: احمدی
                nationalCode:
                  type: string
                  example: '1234567890'
                fingerprint:
                  allOf:
                    - $ref: '#/components/schemas/User.DeviceFingerprint'
                  description: Optional device fingerprint for fraud detection signals.
              required:
                - firstName
                - lastName
                - nationalCode
      security:
        - {}
  /user/fraud-incidents:
