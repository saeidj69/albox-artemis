          nullable: true
        grantedAt:
          type: string
          allOf:
            - $ref: '#/components/schemas/DateTimeAtom'
          nullable: true
      description: |-
        A reward as shown to the customer who earned it.

        `lastError` is deliberately absent: it holds the raw error text from a failed wallet credit,
        which is operational detail for staff. Read it from the administrative endpoints instead.
    Incentives.CustomerSummary:
      type: object
