  /payment/users/{userId}/wallets/pay-on-delivery:
    patch:
      operationId: updatePayOnDeliveryWalletStatus
      summary: 'Admin: Enable or disable a pay-on-delivery wallet'
      description: |-
        Requires `manage_pay_on_delivery_wallets` permission. Disabling prevents new
        customer pay-on-delivery checkout and borrowing, while preserving the wallet's
        existing balance and debt. Existing payment and recovery flows may still use
        the wallet when explicitly authorized by wallet caps. Enabling restores
        eligibility under the usual wallet limits.
        Returns 404 if the user has no pay-on-delivery wallet.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: uint64
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment.Wallet'
      tags:
        - Wallet Management
