                    Frontend result page. Jupiter redirects here with `status`, `type`, and `message` query parameters.
                    Successful redirects also include `amount` and `referenceId`.
              required:
                - amount
                - gateway
                - callbackUrl
  /payment/client/cheques:
    get:
      operationId: listCustomerCheques
      summary: 'Client: List accepted cheques'
      description: Returns only customer-visible accepted cheques with simplified pending, cleared, or bounced status.
      parameters:
        - name: statuses
          in: query
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Payment.CustomerChequeStatus'
          explode: false
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: uint16
            minimum: 1
            maximum: 100
            default: 20
          explode: false
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - cheques
                  - metadata
                properties:
                  cheques:
                    type: array
                    items:
                      $ref: '#/components/schemas/Payment.CustomerCheque'
                  metadata:
                    type: object
                    properties:
                      nextCursor:
                        type: string
                        nullable: true
                    required:
                      - nextCursor
      tags:
        - Cheques
  /payment/client/methods:
    get:
      operationId: getPaymentMethods
      summary: 'Client: Get available payment methods'
      description: |-
        Retrieve available payment methods for the authenticated user.
        Includes method details.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment.PaymentMethodsResponse'
      tags:
        - Payment Management
  /payment/client/profile:
    get:
      operationId: getPaymentProfile
      summary: 'Client: Get user payment profile'
      description: Retrieve user's payment profile including wallet balances, spendable amounts, and debt
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment.PaymentProfileResponse'
      tags:
        - Wallet Management
  /payment/collection/cheques:
    get:
      operationId: listOutstandingCollectionCheques
      summary: 'Driver: List outstanding cheques'
      description: Driver work queue for draft and in-custody cheques. It does not expose other customers' collections.
      parameters:
        - name: statuses
          in: query
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Payment.ChequeStatus'
          explode: false
        - name: verificationStatuses
          in: query
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Payment.ChequeVerificationStatus'
          explode: false
        - name: referenceEntity
          in: query
          required: false
          schema:
            type: string
          explode: false
        - name: referenceId
          in: query
          required: false
          schema:
            type: string
          explode: false
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: uint16
            minimum: 1
            maximum: 100
            default: 20
          explode: false
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - cheques
                  - metadata
                properties:
                  cheques:
                    type: array
                    items:
                      $ref: '#/components/schemas/Payment.DriverCheque'
                  metadata:
                    type: object
                    properties:
                      nextCursor:
                        type: string
                        nullable: true
                    required:
                      - nextCursor
      tags:
        - Cheque Collection
  /payment/collection/cheques/{chequeId}:
    get:
      operationId: getDriverCheque
      summary: 'Driver: Get an outstanding cheque'
      parameters:
        - name: chequeId
          in: path
          required: true
          schema:
            type: integer
            format: uint64
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cheque:
                    $ref: '#/components/schemas/Payment.DriverCheque'
                required:
                  - cheque
      tags:
        - Cheque Collection
  /payment/collection/cheques/{chequeId}/cancel:
    post:
      operationId: cancelChequeSubmission
      summary: 'Driver: Cancel a draft cheque'
      description: Cancels a submission before physical custody begins.
      parameters:
        - name: chequeId
          in: path
          required: true
          schema:
            type: integer
            format: uint64
      responses:
        '200':
          description: The request has succeeded.
      tags:
        - Cheque Collection
  /payment/collection/cheques/{chequeId}/confirm-custody:
    post:
      operationId: confirmChequeCustody
      summary: 'Driver: Confirm physical cheque custody'
      description: Records physical handover after verification, funds the cheque wallet, and settles the original payment as far as available funds allow.
      parameters:
        - name: chequeId
          in: path
          required: true
          schema:
            type: integer
            format: uint64
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment.ChequeCustodyResult'
      tags:
        - Cheque Collection
  /payment/collection/cheques/{chequeId}/retry-verification:
    post:
      operationId: retryChequeVerification
      summary: 'Driver: Retry unresolved cheque verification'
      description: Queues another Sayad inquiry only when the prior result was unresolved; rejection and final verification are not retried.
      parameters:
        - name: chequeId
          in: path
          required: true
          schema:
            type: integer
            format: uint64
      responses:
        '200':
          description: The request has succeeded.
      tags:
        - Cheque Collection
  /payment/collection/valid-cheque-dates:
    get:
      operationId: listValidChequeDates
      summary: 'Driver: List selectable cheque due dates'
      description: Returns selectable cheque dates for any authenticated user; no cheque-specific permission or active collection access is required.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  dates:
                    type: array
                    items:
                      $ref: '#/components/schemas/Date'
                required:
                  - dates
      tags:
        - Cheque Collection
  /payment/collection/{referenceEntity}/{referenceId}/cheques:
    get:
      operationId: listCollectionCheques
      summary: 'Driver: List cheques for a collection target'
      parameters:
        - name: referenceEntity
          in: path
          required: true
          schema:
            type: string
        - name: referenceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cheques:
                    type: array
                    items:
                      $ref: '#/components/schemas/Payment.DriverCheque'
                required:
                  - cheques
      tags:
        - Cheque Collection
    post:
      operationId: submitCheque
      summary: 'Driver: Submit a cheque for verification'
      description: Creates a draft and starts asynchronous Sayad verification. Submission is not proof that the cheque was accepted.
      parameters:
        - name: referenceEntity
          in: path
          required: true
          schema:
            type: string
        - name: referenceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment.DriverCheque'
      tags:
        - Cheque Collection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Payment.ChequeSubmissionRequest'
  /payment/collection/{referenceEntity}/{referenceId}/profile:
    get:
      operationId: getDriverCollectionProfile
      summary: 'Driver: Get collection payment capacity'
      description: Describes the payment methods and remaining amount for an active collection target, without revealing raw wallet balances.
      parameters:
        - name: referenceEntity
          in: path
          required: true
          schema:
            type: string
        - name: referenceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment.DriverCollectionProfile'
      tags:
        - Cheque Collection
  /payment/first-party-pos/callbacks/pos/transactions/{transactionId}/verify:
    post:
      operationId: verifyFirstPartyPosPayment
      summary: 'First Party: Verify POS Payment'
      description: |-
        Submit the terminal callback result for a first-party POS transaction.
        Requires 'VerifyFirstPartyPosPayment' permission.
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: integer
            format: uint64
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required:
                  - success
      tags:
        - POS Payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Payment.VerifyPosPaymentBody'
  /payment/first-party-pos/payments/{referenceEntity}/{referenceId}/pending:
    get:
      operationId: getFirstPartyPosPendingPayment
      summary: 'First Party: Get Pending POS Payment'
      description: |-
        Initiate or retrieve a pending first-party POS transaction for a given reference.
        Requires 'GetPendingFirstPartyPosPayment' permission.
      parameters:
        - name: referenceEntity
          in: path
          required: true
          schema:
            type: string
        - name: referenceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pendingAmount:
                    type: integer
                    format: uint64
                    description: Amount due in the smallest currency unit
                  uniqueIdentifier:
                    type: integer
                    format: uint64
                    description: Verhoeff-encoded unique identifier for the POS transaction
                  referenceId:
                    type: string
                    description: Verhoeff check-digit-protected reference ID
                  rawReferenceId:
                    anyOf:
                      - type: string
                      - type: integer
                        format: uint64
                    description: Raw internal reference ID, before Verhoeff encoding
                  customer:
                    type: object
                    properties:
                      firstName:
                        type: string
                      lastName:
                        type: string
                    required:
                      - firstName
                      - lastName
                required:
                  - pendingAmount
                  - uniqueIdentifier
                  - referenceId
                  - rawReferenceId
                  - customer
      tags:
        - POS Payment
  /payment/payment-statuses:
    get:
      operationId: listPaymentStatuses
      summary: Get available payment statuses
      description: Retrieve all possible payment status values with their translated labels
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  statuses:
                    type: array
                    items:
                      $ref: '#/components/schemas/Payment.PaymentStatusDefinition'
                required:
                  - statuses
      tags:
        - Payment Management
  /payment/payments:
    get:
      operationId: listPayments
      summary: 'Admin: List Payments'
      description: |-
        Retrieve a paginated list of payments with filtering options.
        Requires 'ViewPayments' permission.
      parameters:
        - name: userId
          in: query
          required: false
          description: Filter by user ID
          schema:
            type: integer
            format: uint64
          explode: false
        - name: referenceEntity
          in: query
          required: false
          description: Reference entity type (required if referenceId is provided)
          schema:
            type: string
          explode: false
        - name: referenceId
          in: query
          required: false
          description: Reference ID (required if referenceEntity is provided)
          schema:
            type: string
          explode: false
        - name: status
          in: query
          required: false
          description: Filter by payment status
          schema:
            $ref: '#/components/schemas/Payment.PaymentStatus'
          explode: false
        - name: from
          in: query
          required: false
          description: Filter payments created after this date
          schema:
            $ref: '#/components/schemas/DateTimeAtom'
          explode: false
        - name: to
          in: query
          required: false
          description: Filter payments created before this date
          schema:
            $ref: '#/components/schemas/DateTimeAtom'
          explode: false
        - name: limit
          in: query
          required: false
          description: Number of items per page (1-100)
          schema:
            type: integer
            format: uint16
            minimum: 1
            maximum: 100
            default: 10
          explode: false
        - name: cursor
          in: query
          required: false
          description: Cursor for pagination
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  payments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Payment.Payment'
                  metadata:
                    type: object
                    properties:
                      nextCursor:
                        type: string
                        description: Cursor for next page of results
                required:
                  - payments
                  - metadata
      tags:
        - Payment Management
  /payment/payments/{referenceEntity}/pay/{referenceId}:
    get:
      operationId: payPayment
      summary: Open payment checkout
      description: |-
        Resolve the authenticated user's latest payment for the reference. A payable
        payment redirects to its gateway checkout page; a non-payable payment returns
        an HTML status page. `amount` is supported only for partial settlement of an
        outstanding pay-on-delivery debt.
      parameters:
        - name: referenceEntity
          in: path
          required: true
          schema:
            type: string
        - name: referenceId
          in: path
          required: true
          schema:
            type: string
        - name: amount
          in: query
          required: false
          description: Optional partial amount to pay through the gateway, in the smallest currency unit
          schema:
            type: integer
            format: uint64
            minimum: 1
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            text/html:
              schema:
                type: string
        '302':
          description: Redirection
          headers:
            location:
              required: true
              schema:
                type: string
      tags:
        - Payment Checkout
  /payment/payments/{referenceEntity}/{referenceId}/latest:
    get:
      operationId: latestPaymentByReference
      summary: Latest Payment by Reference
      description: |-
        Retrieve latest payment by a reference.
        Requires 'ViewPayments' permission or that the payment belongs to the authenticated user
      parameters:
        - name: referenceEntity
          in: path
          required: true
          schema:
            type: string
        - name: referenceId
          in: path
          required: true
          schema:
            type: integer
            format: uint64
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment:
                    $ref: '#/components/schemas/Payment.Payment'
                required:
                  - payment
      tags:
        - Payment Management
  /payment/payments/{referenceEntity}/{referenceId}/pending:
    get:
      operationId: getPosPendingPayment
      summary: Get Pending POS Payment
      description: |-
        Initiate or retrieve a pending third-party POS transaction for a given reference.
        Requires 'GetPendingPosPayment' permission.
      parameters:
        - name: referenceEntity
          in: path
          required: true
          schema:
            type: string
        - name: referenceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment.PendingPosPaymentBody'
      tags:
        - POS Payment
  /payment/payments/{referenceEntity}/{referenceId}/settle-from-balance:
    post:
      operationId: settlePaymentFromBalance
      summary: Settle a payment from wallet balance
      description: |-
        Settle all or part of an authenticated user's outstanding pay-on-delivery debt
        from their eligible spendable wallet balances. The payment must belong to the
        authenticated user and be provisionally paid with a pending debt transaction.
      parameters:
        - name: referenceEntity
          in: path
          required: true
          schema:
            type: string
        - name: referenceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment.PaymentBalanceSettlementResponse'
      tags:
        - Payment Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Payment.PaymentBalanceSettlementRequest'
  /payment/payments/{referenceEntity}/{referenceId}/settle-from-cheque-balance:
    post:
      operationId: settlePaymentFromChequeBalance
      summary: Settle a payment from cheque balance
      description: Spends already available cheque-wallet funds against the authenticated customer's outstanding pay-on-delivery debt.
      parameters:
        - name: referenceEntity
          in: path
          required: true
          schema:
            type: string
        - name: referenceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment.PaymentBalanceSettlementResponse'
      tags:
        - Cheques
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Payment.PaymentBalanceSettlementRequest'
  /payment/transactions:
    get:
      operationId: listTransactions
      summary: 'Admin: List Transactions'
      description: |-
        Retrieve a paginated list of transactions with filtering options.
        Requires 'ViewTransactions' permission.
        Throws:
        - 403 Forbidden if user doesn't have permission
      parameters:
        - name: userId
          in: query
          required: true
          description: Filter by user ID
          schema:
            type: integer
            format: uint64
          explode: false
        - name: from
          in: query
          required: false
          description: Filter transactions created after this date
          schema:
            $ref: '#/components/schemas/DateTimeAtom'
          explode: false
        - name: to
          in: query
          required: false
          description: Filter transactions created before this date
          schema:
            $ref: '#/components/schemas/DateTimeAtom'
          explode: false
        - name: statuses
          in: query
          required: false
          description: Filter by transaction statuses
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Payment.TransactionStatus'
          explode: false
        - name: walletTypes
          in: query
          required: false
          description: Filter by wallet type (matches source or destination wallet)
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Payment.WalletType'
          explode: false
        - name: isDebit
          in: query
          required: false
          description: When true, only return transactions where the user's wallet is the source (money leaving)
          schema:
            type: boolean
          explode: false
        - name: isCredit
          in: query
          required: false
          description: When true, only return transactions where the user's wallet is the destination (money arriving)
          schema:
            type: boolean
          explode: false
        - name: referenceEntity
          in: query
          required: false
          description: Reference entity type (required if referenceId is provided)
          schema:
            type: string
          explode: false
        - name: referenceId
          in: query
          required: false
          description: Reference ID (required if referenceEntity is provided)
          schema:
            type: string
          explode: false
        - name: limit
          in: query
          required: false
          description: Number of items per page (1-50)
          schema:
            type: integer
            format: uint16
            minimum: 1
            maximum: 50
            default: 20
          explode: false
        - name: cursor
          in: query
          required: false
          description: Cursor for pagination
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Payment.Transaction'
                  metadata:
                    type: object
                    properties:
                      nextCursor:
                        type: string
                        nullable: true
                    required:
                      - nextCursor
                required:
                  - transactions
                  - metadata
      tags:
        - Transactions
  /payment/transactions/{obfuscatedId}/checkout:
    get:
      operationId: checkoutGatewayTransaction
      summary: Render gateway checkout
      description: |-
        Initiate the selected internet payment gateway for a pending transaction and
        render the gateway submission form. `amount` is supported only when partially
        settling an outstanding pay-on-delivery debt.
      parameters:
        - name: obfuscatedId
          in: path
          required: true
          description: Obfuscated transaction identifier
          schema:
            type: integer
            format: uint64
        - name: gateway
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Payment.InternetPaymentGateway'
          explode: false
        - name: amount
          in: query
          required: false
          description: Optional partial amount to pay, in the smallest currency unit
          schema:
            type: integer
            format: uint64
            minimum: 1
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            text/html:
              schema:
                type: string
      tags:
        - Payment Checkout
  /payment/users/{userId}/charge-credit:
    post:
      operationId: chargeUserCredit
      summary: 'Admin: Charge User Credit'
      description: |-
        Manually adjust a user's credit wallet. A positive amount adds funds; a
        negative amount deducts funds without taking the wallet below its threshold.
        Records a paid wallet transaction with the supplied comment. Requires
        'ChargeUserCredit' permission.
      parameters:
        - name: userId
          in: path
          required: true
          description: ID of user to charge
          schema:
            type: integer
            format: uint64
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
      tags:
        - Wallet Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: integer
                  format: int64
                  description: 'Signed adjustment in Rials: positive adds funds, negative deducts funds'
                  example: 100000
                comment:
                  type: string
                  description: Comment/reason for the charge
                customMetadata:
                  type: object
                  additionalProperties:
                    type: string
              required:
                - amount
                - comment
        description: Charge details
  /payment/users/{userId}/charge-gift:
    post:
      operationId: chargeUserGift
      summary: 'Admin: Charge User Gift'
      description: |-
        Manually adjust a user's gift wallet. A positive amount adds funds; a
        negative amount deducts funds without taking the wallet below its threshold.
        Records a paid wallet transaction with the supplied comment. Requires
        'ChargeUserGift' permission.
      parameters:
        - name: userId
          in: path
          required: true
          description: ID of user to charge
          schema:
            type: integer
            format: uint64
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
      tags:
        - Wallet Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: integer
                  format: int64
                  description: 'Signed adjustment in Rials: positive adds funds, negative deducts funds'
                  example: 100000
                comment:
                  type: string
                  description: Comment/reason for the charge
                customMetadata:
                  type: object
                  additionalProperties:
                    type: string
              required:
                - amount
                - comment
        description: Charge details
  /payment/users/{userId}/wallets:
    get:
      operationId: listUserWallets
      summary: 'Admin: List User Wallets'
      description: |-
        Retrieve a list of wallets for a specific user.
        Requires 'ViewUserWallets' permission.
      parameters:
        - name: userId
          in: path
          required: true
          description: ID of the user to get wallets for
          schema:
            type: integer
            format: uint64
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  wallets:
                    type: array
                    items:
                      $ref: '#/components/schemas/Payment.Wallet'
                required:
                  - wallets
      tags:
        - Wallet Management
  /payment/users/{userId}/wallets/barook:
    patch:
      operationId: updateBarookWalletStatus
      summary: 'Admin: Enable or disable a Barook wallet'
      description: Requires `manage_barook_wallets` permission. Does not change balance or commission.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: uint64
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment.Wallet'
