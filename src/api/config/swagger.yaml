                  type: integer
                  format: uint64
                  minimum: 1
                districtId:
                  type: integer
                  format: uint64
                  minimum: 1
                weekday:
                  type: integer
                  format: uint8
                  minimum: 1
                  maximum: 7
                  description: ISO weekday number where Monday is 1 and Sunday is 7.
