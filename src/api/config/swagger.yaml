                format: uint64
              - type: string
                enum:
                  - me
        - name: key
          in: path
          required: true
          schema:
            type: string
            pattern: ^[0-9A-Za-z_.-]+$
            minLength: 1
            maxLength: 64
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User.ClientStateResponseBody'
      tags:
        - Client State
    delete:
      operationId: deleteClientState
      summary: Delete Client State
      description: Deletes a client-state entry when the current session is allowed to mutate it. Missing or unreadable entries still return no content.
