paths:
  /calendar:
    get:
      operationId: listCalendarEvents
      summary: List Calendar Events
      parameters:
        - name: from_date
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Date'
          explode: false
        - name: to_date
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Date'
          explode: false
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Calendar.EventType'
          explode: false
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            nullable: true
            default: null
          explode: false
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: uint8
            minimum: 1
            maximum: 100
            default: 20
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/Calendar.CalendarEvent'
                  metadata:
                    type: object
                    properties:
                      nextCursor:
                        type: string
                        nullable: true
                    required:
                      - nextCursor
                required:
                  - events
                  - metadata
      tags:
        - Calendar
    post:
      operationId: createCalendarEvent
      summary: Create Calendar Event
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  event:
                    $ref: '#/components/schemas/Calendar.CalendarEvent'
                required:
                  - event
      tags:
        - Calendar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                  minLength: 1
                  maxLength: 255
                type:
                  $ref: '#/components/schemas/Calendar.EventType'
                date:
                  $ref: '#/components/schemas/Date'
              required:
                - label
                - type
                - date
  /calendar/{eventId}:
    delete:
      operationId: deleteCalendarEvent
      summary: Delete Calendar Event
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
            format: uint64
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
      tags:
        - Calendar
  /enum-options:
    get:
      operationId: getAllEnumOptions
      summary: Get All Enum Options
      description: Returns registered enum option namespaces. Each enum option includes the stored value and a display label, so frontend clients do not need to hard-code selectable enum labels.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  enumNamespaces:
                    type: array
                    items:
                      $ref: '#/components/schemas/EnumOptions.EnumOptionNamespace'
                required:
                  - enumNamespaces
      tags:
        - Enum Options
  /enum-options/{namespace}:
    get:
      operationId: getEnumOptionNamespace
      summary: Get Enum Option Namespace
      description: Returns one registered enum option namespace. Returns 404 if the namespace is not registered.
      parameters:
        - name: namespace
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  enumNamespace:
                    $ref: '#/components/schemas/EnumOptions.EnumOptionNamespace'
                required:
                  - enumNamespace
        '404':
          description: The server cannot find the requested resource.
      tags:
        - Enum Options
  /enum-options/{namespace}/{enum}:
    get:
      operationId: getEnumOptions
      summary: Get Enum Options
      description: Returns one registered enum's available values and labels. The `enum` path parameter is the enum key without its namespace prefix. Returns 404 if the namespace or enum is not registered.
      parameters:
        - name: namespace
          in: path
          required: true
          schema:
            type: string
        - name: enum
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  enum:
                    $ref: '#/components/schemas/EnumOptions.EnumOptionDefinition'
                required:
                  - enum
        '404':
          description: The server cannot find the requested resource.
      tags:
        - Enum Options
  /incentives/admin/incentive-campaigns:
    get:
      operationId: listIncentiveCampaigns
      description: Cursor-paginated administrative campaign index. Use `nextCursor` verbatim for the next page.
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          explode: false
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaigns:
                    type: array
                    items:
                      $ref: '#/components/schemas/Incentives.Campaign'
                  metadata:
                    type: object
                    properties:
                      nextCursor:
                        type: string
                        nullable: true
                    required:
                      - nextCursor
                required:
                  - campaigns
                  - metadata
      tags:
        - Incentives
    post:
      operationId: createIncentiveCampaign
      description: |-
        Creates a draft. A campaign must subsequently be confirmed before customers can be assigned.

        Rejects a duplicate `internalName`, duplicate step `position` values, and a window that starts
        or ends in the past.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaign:
                    $ref: '#/components/schemas/Incentives.Campaign'
                required:
                  - campaign
      tags:
        - Incentives
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Incentives.CampaignInput'
  /incentives/admin/incentive-campaigns/{campaignId}:
    get:
      operationId: getIncentiveCampaign
      description: Returns a campaign definition, including steps and notifications where loaded.
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            type: integer
            format: uint64
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaign:
                    $ref: '#/components/schemas/Incentives.Campaign'
                required:
                  - campaign
      tags:
        - Incentives
    patch:
      operationId: updateIncentiveCampaign
      description: |-
        Updates a draft only. The request is a partial campaign definition; confirmed campaigns are immutable.

        Rejects an `internalName` already used by another campaign, duplicate step `position` values,
        an `endAt` that is or becomes past, and a `startAt` moved further back than its current value
        when that value is already past.
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            type: integer
            format: uint64
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaign:
                    $ref: '#/components/schemas/Incentives.Campaign'
                required:
                  - campaign
      tags:
        - Incentives
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Incentives.CampaignUpdateInput'
  /incentives/admin/incentive-campaigns/{campaignId}/confirm:
    post:
      operationId: confirmIncentiveCampaign
      description: |-
        Validates and freezes a draft definition. This is the last point at which the whole definition is
        checked, so it is where most definition errors surface.

        Confirmation requires at least one step, unique step positions, campaign-end reward timing, a
        window that has not already elapsed, rule and reward configuration each valid for its type, and
        notification configuration and templates valid for their interaction.
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            type: integer
            format: uint64
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaign:
                    $ref: '#/components/schemas/Incentives.Campaign'
                required:
                  - campaign
      tags:
        - Incentives
  /incentives/admin/incentive-campaigns/{campaignId}/participants:
    get:
      operationId: listIncentiveCampaignParticipants
      description: Cursor-paginated participant list. This deliberately returns configured participant steps, not live evaluation for every row.
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            type: integer
            format: uint64
        - name: customerId
          in: query
          required: false
          schema:
            type: integer
            format: uint64
          explode: false
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          explode: false
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  participants:
                    type: array
                    items:
                      $ref: '#/components/schemas/Incentives.Participant'
                  metadata:
                    type: object
                    properties:
                      nextCursor:
                        type: string
                        nullable: true
                    required:
                      - nextCursor
                required:
                  - participants
                  - metadata
      tags:
        - Incentives
    post:
      operationId: addIncentiveCampaignParticipants
      description: |-
        Adds one or more participants atomically. Each item must supply the complete set of campaign steps.

        The whole request succeeds or fails together, so a batch is capped at 200 participants. This is a
        per-request limit, not a limit on how many customers a campaign may have: enrol larger audiences
        by sending several batches.
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            type: integer
            format: uint64
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  participants:
                    type: array
                    items:
                      $ref: '#/components/schemas/Incentives.Participant'
                required:
                  - participants
      tags:
        - Incentives
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                participants:
                  type: array
                  items:
                    $ref: '#/components/schemas/Incentives.ParticipantInput'
                  minItems: 1
                  maxItems: 200
              required:
                - participants
  /incentives/admin/incentive-campaigns/{campaignId}/participants/{participantId}:
    get:
      operationId: getIncentiveCampaignParticipant
      description: |-
        Returns one participant's configured steps, rewards and settlement when present, and its
        evaluation. The evaluation is a live estimate until the participant is settled and the frozen
        settlement result afterwards; check `evaluation.isFinal` rather than inferring from campaign state.
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            type: integer
            format: uint64
        - name: participantId
          in: path
          required: true
          schema:
            type: integer
            format: uint64
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  participant:
                    $ref: '#/components/schemas/Incentives.Participant'
                  evaluation:
                    $ref: '#/components/schemas/Incentives.Evaluation'
                required:
                  - participant
                  - evaluation
      tags:
        - Incentives
  /incentives/admin/incentive-campaigns/{campaignId}/settle:
    post:
      operationId: startIncentiveCampaignSettlement
      description: |-
        Starts post-end settlement once, for a confirmed campaign whose window has ended.

        The request only marks the campaign as settling and enqueues the fan-out; participants are
        dispatched, evaluated, and paid asynchronously, so a campaign with a very large participant
        count does not make this call long-running. Expect settlement counters to stay at zero briefly
        after a successful response.
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            type: integer
            format: uint64
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
      tags:
        - Incentives
  /incentives/admin/incentive-campaigns/{campaignId}/settlement:
    get:
      operationId: getIncentiveCampaignSettlement
      description: |-
        Operational settlement view: participant counts, reward counts, and a bounded sample of failed
        rewards for diagnostics. Unresolved rewards — failed *or* pending — are what hold a campaign
        open; both are retried automatically and there is no manual retry endpoint.
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            type: integer
            format: uint64
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  settlement:
                    $ref: '#/components/schemas/Incentives.SettlementSummary'
                required:
                  - settlement
      tags:
        - Incentives
  /incentives/me/incentive-campaigns:
    get:
      operationId: listMyIncentiveCampaigns
      description: |-
        Cursor-paginated customer campaign history, newest campaign end first. Includes configured steps,
        rewards, settlement, and a page-bounded evaluation per participant. Each evaluation is a live
        estimate until that participant is settled and the frozen settlement result afterwards; see
        `evaluation.isFinal`.
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          explode: false
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 10
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaigns:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          format: uint64
                        displayName:
                          type: string
                        description:
                          type: string
                          nullable: true
                        startAt:
                          $ref: '#/components/schemas/DateTimeAtom'
                        endAt:
                          $ref: '#/components/schemas/DateTimeAtom'
                        progression:
                          $ref: '#/components/schemas/Incentives.CampaignProgression'
                        rewardResolution:
                          $ref: '#/components/schemas/Incentives.RewardResolution'
                        rewardTiming:
                          $ref: '#/components/schemas/Incentives.RewardTiming'
                        state:
                          $ref: '#/components/schemas/Incentives.CampaignState'
                        confirmedAt:
                          type: string
                          allOf:
                            - $ref: '#/components/schemas/DateTimeAtom'
                          nullable: true
                        settlementStartedAt:
                          type: string
                          allOf:
                            - $ref: '#/components/schemas/DateTimeAtom'
                          nullable: true
                        completedAt:
                          type: string
                          allOf:
                            - $ref: '#/components/schemas/DateTimeAtom'
                          nullable: true
                        createdAt:
                          $ref: '#/components/schemas/DateTimeAtom'
                        updatedAt:
                          $ref: '#/components/schemas/DateTimeAtom'
                        participantId:
                          type: integer
                          format: uint64
                        participant:
                          type: object
                          properties:
                            id:
                              type: integer
                              format: uint64
                            campaignId:
                              type: integer
                              format: uint64
                            customerId:
                              type: integer
                              format: uint64
                            customer:
                              type: object
                              allOf:
                                - $ref: '#/components/schemas/Incentives.CustomerSummary'
                              nullable: true
                            createdAt:
                              $ref: '#/components/schemas/DateTimeAtom'
                            updatedAt:
                              $ref: '#/components/schemas/DateTimeAtom'
                            steps:
                              type: array
                              items:
                                $ref: '#/components/schemas/Incentives.ParticipantStep'
                            settlement:
                              type: object
                              allOf:
                                - $ref: '#/components/schemas/Incentives.ParticipantSettlement'
                              nullable: true
                            rewards:
                              type: array
                              items:
                                $ref: '#/components/schemas/Incentives.CustomerReward'
                            evaluation:
                              $ref: '#/components/schemas/Incentives.Evaluation'
                          required:
                            - id
                            - campaignId
                            - customerId
                            - customer
                            - createdAt
                            - updatedAt
                      required:
                        - id
                        - displayName
                        - description
                        - startAt
                        - endAt
                        - progression
                        - rewardResolution
                        - rewardTiming
                        - state
                        - confirmedAt
                        - settlementStartedAt
                        - completedAt
                        - createdAt
                        - updatedAt
                        - participantId
                        - participant
                  metadata:
                    type: object
                    properties:
                      nextCursor:
                        type: string
                        nullable: true
                    required:
                      - nextCursor
                required:
                  - campaigns
                  - metadata
      tags:
        - Incentives
  /incentives/me/incentive-campaigns/{campaignId}:
    get:
      operationId: getMyIncentiveCampaign
      description: |-
        Customer-safe detail for one enrolled campaign. Returns 404 when the caller is not a participant.
        The evaluation is a live estimate until the participant is settled and the frozen settlement
        result afterwards; see `evaluation.isFinal`.
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            type: integer
            format: uint64
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaign:
                    $ref: '#/components/schemas/Incentives.CustomerCampaign'
                  participant:
                    $ref: '#/components/schemas/Incentives.CustomerParticipant'
                  evaluation:
                    $ref: '#/components/schemas/Incentives.Evaluation'
                required:
                  - campaign
                  - participant
                  - evaluation
      tags:
        - Incentives
  /listing/brands:
    get:
      operationId: listBrands_Listing
      summary: List Brands (Listing)
      parameters:
        - name: query
          in: query
          required: false
          description: Search term for fuzzy full text search
          schema:
            type: string
            minLength: 2
          explode: false
        - name: latitude
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Latitude'
          explode: false
        - name: longitude
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Longitude'
          explode: false
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            nullable: true
            default: null
          explode: false
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: uint64
            minimum: 1
            maximum: 50
            default: 100
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  brands:
                    type: array
                    items:
                      $ref: '#/components/schemas/Listing.Brand'
                  metadata:
                    type: object
                    properties:
                      nextCursor:
                        type: string
                        nullable: true
                    required:
                      - nextCursor
                required:
                  - brands
                  - metadata
      tags:
        - Catalogue
  /listing/brands/{brandId}:
    get:
      operationId: getBrand_Listing
      summary: Get Brand (Listing)
      parameters:
        - name: brandId
          in: path
          required: true
          schema:
            type: integer
            format: uint64
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  brand:
                    $ref: '#/components/schemas/Listing.Brand'
                required:
                  - brand
      tags:
        - Catalogue
  /listing/categories:
    get:
      operationId: getCategoryTree
      summary: Get Category Tree
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories:
                    type: array
                    items:
                      $ref: '#/components/schemas/Listing.Category'
                required:
                  - categories
      tags:
        - Catalogue
  /listing/index-management/reindex-brands:
    post:
      operationId: reindexBrands
      summary: Re-Index Brands
      description: Queues brand search-index rebuilding and returns the number of dispatched items.
      parameters: []
      responses:
        '202':
          description: The request has been accepted for processing, but processing has not yet completed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  dispatchedCount:
                    type: integer
                    format: uint64
                required:
                  - dispatchedCount
      tags:
        - Index Management
  /listing/index-management/reindex-categories:
    post:
      operationId: reindexCategories
      summary: Re-Index Categories
      description: Queues category search-index rebuilding and returns the number of dispatched items.
      parameters: []
      responses:
        '202':
          description: The request has been accepted for processing, but processing has not yet completed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  dispatchedCount:
                    type: integer
                    format: uint64
                required:
                  - dispatchedCount
      tags:
        - Index Management
  /listing/index-management/reindex-manufacturers:
    post:
      operationId: reindexManufacturers
      summary: Re-Index Manufacturers
      description: Queues manufacturer search-index rebuilding and returns the number of dispatched items.
      parameters: []
      responses:
        '202':
          description: The request has been accepted for processing, but processing has not yet completed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  dispatchedCount:
                    type: integer
                    format: uint64
                required:
                  - dispatchedCount
      tags:
        - Index Management
  /listing/index-management/reindex-pages:
    post:
      operationId: reindexPages
      summary: Re-Index Pages
      description: Queues page search-index rebuilding and returns the number of dispatched items.
      parameters: []
      responses:
        '202':
