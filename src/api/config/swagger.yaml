security:
  - BearerAuth: []
  - ApiKeyAuth: []
components:
  schemas:
    AuthScope:
      type: string
      enum:
        - client
        - back_office
        - delivery_app
        - pos_user
        - visitor_app
    Calendar.CalendarEvent:
      type: object
      required:
        - id
        - label
        - type
        - date
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: uint64
        label:
          type: string
        type:
          $ref: '#/components/schemas/Calendar.EventType'
        date:
          $ref: '#/components/schemas/Date'
        createdAt:
          $ref: '#/components/schemas/DateTimeAtom'
        updatedAt:
          $ref: '#/components/schemas/DateTimeAtom'
    Calendar.EventType:
      type: string
      enum:
        - official_holiday
        - operationally_sensitive_day
    Date:
      type: string
      pattern: ^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
      description: ISO 8601 date
      example: '2025-01-01'
    DateTimeAtom:
      type: string
      pattern: ^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])T([01]\d|2[0-3]):[0-5]\d:[0-5]\d[+-](0\d|1[0-4]):[0-5]\d$
      description: ISO 8601 date-time with timezone
      example: '2025-01-01T00:00:00+03:30'
    EnumOptions.EnumOption:
      type: object
      required:
        - value
        - label
      properties:
        value:
          type: string
          example: base
        label:
          type: string
          example: Base
    EnumOptions.EnumOptionDefinition:
      type: object
      required:
        - key
        - options
      properties:
        key:
          type: string
          example: product:product_discount_type
        options:
          type: array
          items:
            $ref: '#/components/schemas/EnumOptions.EnumOption'
    EnumOptions.EnumOptionNamespace:
      type: object
      required:
        - key
