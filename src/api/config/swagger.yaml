  /product/product-discounts/smart-update:
    put:
      operationId: smartUpdateProductDiscounts
      summary: Smart Update Product Discounts
      description: 'Replaces the base and marketing timelines for one product, exact user-group/district combination, and selected isCashback value. Normal discount and cashback timelines are independent: changing one preserves the other. Existing coverage outside the requested interval is preserved, touching intervals with the same percentage may be merged, and a zero percentage removes that type only from the selected timeline and requested interval. The response reports only records actually created, updated, or removed, using the full product-discount response shape.'
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  created:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product.ProductDiscountChange'
                  updated:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product.ProductDiscountChange'
                  removed:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product.ProductDiscountChange'
                required:
                  - created
                  - updated
                  - removed
      tags:
        - Product Discount Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                productId:
                  type: integer
                  format: uint64
                  minimum: 1
                isCashback:
                  type: boolean
                  description: Selects both the base and marketing cashback timelines when true; omitted or false selects normal discounts.
                  default: false
                userGroupId:
                  type: integer
                  format: uint64
                  nullable: true
                  description: Exact user-group criterion to update. Use null for discounts without a user-group criterion.
                districtId:
                  type: integer
                  format: uint64
                  nullable: true
                  description: Exact commercial-district criterion to update. Use null for discounts without a district criterion.
                basePercentage:
                  allOf:
                    - $ref: '#/components/schemas/Product.ProductDiscountPercentage'
                  description: Requested base percentage for the selected timeline. Must have at most two decimal places and be between 0 and 99.99. Effective normal discounts consume the shared 100 percent benefit budget before cashback; excess cashback is capped when applied.
                marketingPercentage:
                  allOf:
                    - $ref: '#/components/schemas/Product.ProductDiscountPercentage'
                  description: Requested marketing percentage for the selected timeline. Must have at most two decimal places and be between 0 and 99.99. Effective normal discounts consume the shared 100 percent benefit budget before cashback; excess cashback is capped when applied.
                startedAt:
                  allOf:
                    - $ref: '#/components/schemas/DateTimeAtom'
                  description: Inclusive start of the replacement interval. Must be in the future and aligned to the configured discount minute multiplier, with zero seconds and microseconds.
                endedAt:
                  allOf:
                    - $ref: '#/components/schemas/DateTimeAtom'
                  description: Exclusive end of the replacement interval. Must be after startedAt and aligned to the configured discount minute multiplier, with zero seconds and microseconds.
              required:
                - productId
                - userGroupId
                - districtId
                - basePercentage
                - marketingPercentage
                - startedAt
                - endedAt
