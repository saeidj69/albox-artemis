  /user/users/{userId}/permission-sets:
    post:
      operationId: assignPermissionSetsToUser
      summary: Assign Permission Sets to a User
      description: |-
        Assign one or more permission sets to a user. For each set, every permission it
        contains is inserted into the user's `user_permissions` tagged with the source set,
        atomically.

        Requires 'AssignPermissionSets' permission AND the caller must already hold every
        permission contained in every set being assigned (escalation guard).

        The user cannot already hold any of the assigned permissions, either directly or
        via another set. The API rejects mixed sourcing with `permission_already_held`.

        May throw:
        - ForbiddenException if the caller lacks 'AssignPermissionSets'
        - PermissionEscalationException if the caller lacks any permission inside any of the listed sets
        - PermissionAlreadyHeldException if the user already holds any of those permissions
        - PermissionSetNotFoundException if any listed set does not exist
        - UserNotFoundException if the user does not exist
      parameters:
        - name: userId
          in: path
          required: true
          description: Target user ID
          schema:
            type: integer
            format: uint64
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  permissions:
                    type: array
                    items:
                      $ref: '#/components/schemas/User.UserPermission'
                    description: The user's full, refreshed permission list after the assignment.
                required:
                  - permissions
      tags:
        - Permission Set Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                permissionSetIds:
                  type: array
                  items:
                    type: integer
                    format: uint64
                  minItems: 1
                  description: IDs of permission sets to assign.
                  example:
                    - 1
                    - 4
              required:
                - permissionSetIds
  /user/users/{userId}/permission-sets/{permissionSetId}:
    delete:
      operationId: revokePermissionSetFromUser
      summary: Revoke a Permission Set from a User
      description: |-
        Remove every `user_permissions` row that the given set previously contributed to
        the given user. Direct (non-set-sourced) grants for the same permissions, if any,
        are left untouched.

        The operation is idempotent: silently no-ops if the set was not assigned to the user.

        Requires 'RevokePermissionSets' permission.

        May throw:
        - ForbiddenException if user doesn't have permission
        - PermissionSetNotFoundException if the set does not exist
        - UserNotFoundException if the user does not exist
      parameters:
        - name: userId
          in: path
          required: true
          description: Target user ID
          schema:
            type: integer
            format: uint64
        - name: permissionSetId
          in: path
          required: true
          description: Permission set ID
          schema:
            type: integer
            format: uint64
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
      tags:
        - Permission Set Management
  /user/users/{userId}/permissions:
    get:
      operationId: listUserPermissions
      summary: List a User's Permissions
      description: |-
        Return every permission currently held by the given user, with a `source`
        marker indicating whether each one was granted directly or inherited from
        a permission set.
        Requires 'ViewAnyUsersPermissions' permission.

        May throw:
        - ForbiddenException if user doesn't have permission
        - UserNotFoundException if the user does not exist
      parameters:
        - name: userId
          in: path
          required: true
          description: Target user ID
          schema:
            type: integer
            format: uint64
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  permissions:
                    type: array
                    items:
                      $ref: '#/components/schemas/User.UserPermission'
                required:
                  - permissions
      tags:
        - Permission Management
    post:
      operationId: grantUserPermissions
      summary: Grant Permissions to a User
      description: |-
        Grant one or more permissions to the given user as direct (non-set-sourced) grants.
        All grants happen atomically.

        Requires 'GrantPermissions' permission AND the caller must already hold every
        permission they are attempting to grant (escalation guard).

        The user cannot already hold any of the requested permissions, either directly
        or via a permission set — the API rejects mixed sourcing with `permission_already_held`.

        May throw:
        - ForbiddenException if the caller lacks 'GrantPermissions'
        - PermissionEscalationException if the caller lacks any of the requested permissions themselves
        - PermissionAlreadyHeldException if the user already holds any of the requested permissions (direct or via a set)
        - UserNotFoundException if the user does not exist
      parameters:
        - name: userId
          in: path
          required: true
          description: Target user ID
          schema:
            type: integer
            format: uint64
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  permissions:
                    type: array
                    items:
                      $ref: '#/components/schemas/User.UserPermission'
                    description: The user's full, refreshed permission list after the grant.
                required:
                  - permissions
      tags:
        - Permission Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                permissions:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  description: Permission values to grant. Each item must be a valid permission identifier (see `GET /user/permissions`).
                  example:
                    - view_all_users
                    - create_users
              required:
                - permissions
    delete:
      operationId: revokeUserPermissions
      summary: Revoke Permissions from a User
      description: |-
        Revoke one or more direct permissions from the given user. Set-sourced permissions
        cannot be revoked through this endpoint — to remove a permission inherited from a
        permission set, revoke the set itself via `DELETE /user/users/{userId}/permission-sets/{permissionSet}`.

        The operation is idempotent: silently no-ops for permissions the user does not
        currently hold directly.

        Requires 'RevokePermissions' permission.

        May throw:
        - ForbiddenException if the caller lacks 'RevokePermissions'
        - PermissionSourcedFromSetException if any listed permission is held via a permission set
        - UserNotFoundException if the user does not exist
      parameters:
        - name: userId
          in: path
          required: true
          description: Target user ID
          schema:
            type: integer
            format: uint64
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  permissions:
                    type: array
                    items:
                      $ref: '#/components/schemas/User.UserPermission'
                    description: The user's full, refreshed permission list after the revoke.
                required:
                  - permissions
      tags:
        - Permission Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                permissions:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  description: Permission values to revoke. Only direct grants are removed.
                  example:
                    - view_all_users
              required:
                - permissions
  /user/users/{userId}/surena-code:
    put:
      operationId: assignSurenaCode
      summary: Assign Surena Code to a User
      parameters:
        - name: userId
