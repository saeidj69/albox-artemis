            type: array
            items:
              $ref: '#/components/schemas/FraudIncidentStatus'
          explode: false
        - name: types
          in: query
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/FraudIncidentType'
          explode: false
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          explode: false
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: uint8
          explode: false
