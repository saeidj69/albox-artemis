            - `0`: Returns only users without an assigned visitor
            - Omit parameter: Returns all users regardless of visitor assignment
          schema:
            type: boolean
          explode: false
        - name: cursor
          in: query
          required: false
          description: Cursor for pagination. Use the `nextCursor` value from the previous response to fetch the next page of results.
          schema:
            type: string
            nullable: true
          explode: false
        - name: limit
          in: query
          required: false
          description: Number of users to return per page
          schema:
            type: integer
            format: uint8
            minimum: 1
            maximum: 100
            default: 20
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/Visitor.Customer'
                  metadata:
                    type: object
                    properties:
                      nextCursor:
                        type: string
                        nullable: true
                        description: Cursor for the next page of results. Null if no more results.
                    required:
                      - nextCursor
                required:
                  - users
                  - metadata
      tags:
        - Visitor
