        - Fraud Detection
  /user/fraud-incidents/{incidentId}:
    get:
      operationId: showFraudIncident
      summary: Show Fraud Incident
      description: |-
        Returns the full details of a single fraud incident, including all involved
        members and review history.
        Requires 'ViewFraudIncidents' permission.

        May throw:
        - ForbiddenException if user doesn't have permission
        - FraudIncidentNotFoundException if the incident does not exist
      parameters:
        - name: incidentId
          in: path
          required: true
          schema:
            type: integer
            format: uint64
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  incident:
                    $ref: '#/components/schemas/User.FraudIncidentDetail'
                required:
                  - incident
      tags:
        - Fraud Detection
  /user/fraud-incidents/{incidentId}/review:
    post:
      operationId: reviewFraudIncident
      summary: Review Fraud Incident
      description: |-
        Mark a fraud incident as confirmed or dismissed.
        Can only be called on incidents with status 'open'.
        Dismissed incidents cannot be reviewed again.
        Requires 'ReviewFraudIncidents' permission.

        May throw:
        - ForbiddenException if user doesn't have permission
        - FraudIncidentNotFoundException if the incident does not exist
        - FraudIncidentAlreadyDismissedException if the incident has already been dismissed
      parameters:
        - name: incidentId
          in: path
          required: true
          schema:
            type: integer
            format: uint64
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  incident:
                    $ref: '#/components/schemas/User.FraudIncidentDetail'
                required:
                  - incident
      tags:
        - Fraud Detection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                    - confirmed
                    - dismissed
                  description: Must be 'confirmed' or 'dismissed'. Cannot confirm or dismiss an already-dismissed incident.
                reviewNote:
                  type: string
                  nullable: true
              required:
                - status
