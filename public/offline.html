<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#00302c" />
    <title>آل‌باکس — بدون اتصال</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100dvh;
        background: #ffffff;
        color: #303232;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Tahoma,
          sans-serif;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(2.5rem + env(safe-area-inset-top))
          calc(1rem + env(safe-area-inset-right))
          calc(2.5rem + env(safe-area-inset-bottom))
          calc(1rem + env(safe-area-inset-left));
        text-align: center;
      }

      .page {
        display: flex;
        width: 100%;
        max-width: 28rem;
        flex-direction: column;
        align-items: center;
        animation: fade-in 0.35s ease-out both;
      }

      .logo {
        width: 4rem;
        height: 4rem;
        margin-bottom: 2rem;
      }

      .icon {
        width: 6rem;
        height: 6rem;
        margin-bottom: 1.5rem;
        color: #d32f2f;
      }

      .content {
        display: grid;
        gap: 0.5rem;
        margin-bottom: 2rem;
      }

      h1 {
        margin: 0;
        font-size: 1.375rem;
        font-weight: 700;
        line-height: 1.4;
        color: #303232;
      }

      p {
        margin: 0;
        font-size: 0.9375rem;
        font-weight: 400;
        line-height: 1.7;
        color: #696d6d;
      }

      button {
        display: inline-flex;
        width: 100%;
        max-width: 24rem;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        border: 0;
        border-radius: 12px;
        background: #005049;
        color: #ffffff;
        cursor: pointer;
        font: inherit;
        font-size: 1rem;
        font-weight: 500;
        line-height: 1.5;
        min-height: 3rem;
        padding: 0.75rem 1rem;
        -webkit-tap-highlight-color: transparent;
      }

      button:active {
        opacity: 0.92;
      }

      .button-icon {
        width: 1.25rem;
        height: 1.25rem;
      }

      @keyframes fade-in {
        from {
          opacity: 0;
          transform: translateY(0.5rem);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <main class="page" role="alert" aria-live="polite">
      <svg
        class="icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.75"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M12 20h.01" />
        <path d="M8.5 16.429a5.978 5.978 0 0 1 7 0" />
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
        <path d="M19 12.55a10.94 10.94 0 0 0-2.48-2.43" />
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9" />
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
        <path d="M1 1l22 22" />
      </svg>

      <div class="content">
        <h1>اتصال اینترنت برقرار نیست</h1>
        <p>
          برای استفاده از آل‌باکس به اینترنت نیاز دارید. پس از برقراری اتصال،
          محتوا به‌صورت خودکار بارگذاری می‌شود.
        </p>
      </div>

      <button type="button" id="retry">تلاش مجدد</button>
    </main>

    <script>
      ;(function () {
        function reloadPage() {
          if (!navigator.onLine) return
          window.location.reload()
        }

        document.getElementById('retry').addEventListener('click', reloadPage)

        window.addEventListener('online', reloadPage)
      })()
    </script>
  </body>
</html>
